<!doctype html><meta charset="utf-8"><title>Calendar mascot layout check</title>
<style>
@font-face{font-family:plex;src:url('/node_modules/@expo-google-fonts/ibm-plex-sans/700Bold/IBMPlexSans_700Bold.ttf');font-weight:700}
body{margin:20px;background:#e7eae7;font-family:Arial;color:#20432d}button{padding:10px;margin:3px}.phones{display:flex;gap:28px;align-items:flex-start}.phone{background:white;position:relative;overflow:hidden;height:355px;border:1px solid #bcc9bf}.status{height:44px;box-sizing:border-box;padding:12px 20px;font-size:14px;color:#101813}.tabs{width:224px;height:36px;box-sizing:border-box;margin:3px auto;display:flex;border:1px solid #ccc;border-radius:10px;align-items:center;font-size:11px;font-weight:bold;justify-content:space-around}.heading{padding:10px 12px 0;box-sizing:border-box}.greeting{font-family:plex;font-size:27px;line-height:36px;font-weight:700}.date{font-size:13px;color:#647566;padding-top:7px;padding-bottom:14px}.card{margin:0 12px;background:#d1e6d5;border:1px solid #92b59b;border-radius:20px;height:190px;padding:15px}.sprite{position:absolute;overflow:hidden}.sprite img{position:absolute;max-width:none}.edge{position:absolute;right:0;width:1px;background:#315e3e;opacity:.6}.frames{display:flex;flex-wrap:wrap;max-width:1000px;gap:8px;margin-top:20px}.frame{background:white;position:relative;width:113px;height:137px}.frame .sprite{top:20px;left:0}.frame span{position:absolute;top:1px;left:4px;font-size:12px}
</style>
<p>Layout preview with the production sprite and placement geometry (390px / 320px). Frame <b id="current">0</b></p>
<button onclick="play=true">Play</button><button onclick="show(0)">Rest</button><button onclick="show(7)">Wave</button><button onclick="show(10)">Lower hand</button><button onclick="show(14)">Blink</button>
<div class="phones"></div><div class="frames"></div>
<script>
const durations=[1650,90,90,90,90,90,95,95,95,95,90,100,900,75,95,1400],cycle=durations.reduce((a,b)=>a+b,0);let play=true;
const src='/assets/mascot/calendar-corner-farmer.png';
function sprite(size){let v=document.createElement('div');v.className='sprite';v.style.width=v.style.height=size+'px';v.dataset.size=size;let img=new Image();img.src=src;img.style.width=img.style.height=size*4+'px';v.append(img);return v}
function frame(v,n){let s=+v.dataset.size;v.firstChild.style.transform=`translate(${-n%4*s}px,${-Math.floor(n/4)*s}px)`}
for(const width of [390,320]){let size=Math.max(92,Math.min(116,Math.round(width*.29))),overlap=Math.min(26,Math.max(8,(width-320)*.45+8)),reserve=Math.round(size*.82)+8;let p=document.createElement('div');p.className='phone';p.style.width=width+'px';p.innerHTML='<div class="status">20:00 &nbsp; ▰</div><div class="tabs"><span>Calendar</span><span>Chat</span><span>Others</span></div><div class="heading"><div class="greeting">Good Evening, Jhon</div><div class="date">Sunday, September 27 ↻</div></div><div class="card">Calendar cards</div>';p.querySelector('.heading').style.minHeight=size+8-overlap+'px';p.querySelector('.greeting').style.paddingRight=reserve+'px';p.querySelector('.date').style.maxWidth=width-24-reserve+'px';let v=sprite(size);v.classList.add('live');v.style.top=83-overlap+'px';v.style.right=-size*.055+'px';p.append(v);let e=document.createElement('div');e.className='edge';e.style.top=83-overlap+size*.45+'px';e.style.height=size*.5+'px';p.append(e);document.querySelector('.phones').append(p)}
for(let i=0;i<16;i++){let c=document.createElement('div');c.className='frame';let s=sprite(113);frame(s,i);c.innerHTML='<span>'+i+'</span>';c.append(s);document.querySelector('.frames').append(c)}
function show(n){play=false;document.querySelectorAll('.live').forEach(v=>frame(v,n));document.getElementById('current').textContent=n}
let start=performance.now();function tick(t){if(play){let rem=(t-start)%cycle,n=0;while(rem>=durations[n])rem-=durations[n++];document.querySelectorAll('.live').forEach(v=>frame(v,n));document.getElementById('current').textContent=n}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script>
